{% extends "admin/layout.html" %}
{% block content %}
<div class="text-center mb-4"><img src="/static/images/logo.png" alt="Baidehi Energy" style="height:54px;max-width:130px;object-fit:contain"><div class="page-eyebrow mt-3">Content studio</div><h1 class="page-title h2">Welcome back</h1><p class="text-secondary mb-0">Sign in to manage the website.</p></div>{% if messages.error.length %}<div class="alert alert-danger border-0">{{ messages.error[0] }}</div>{% endif %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrfToken }}"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus autocomplete="username"></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-success btn-admin w-100">Sign in</button></form>
{% endblock %}
