{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark fixed-top baidehi-navbar">
    <div class="container">
<!-- Logo -->
<a class="navbar-brand d-flex align-items-center"
   href="/"
   style="height: 60px; max-height: 60px;">

    <img src="{% static 'images/logo.svg' %}"
         alt="Baidehi Energy Logo"
         style="
            width: 50px !important;
            height: 50px !important;
            max-width: 50px !important;
            max-height: 50px !important;
            min-width: 50px !important;
            min-height: 50px !important;
            object-fit: contain !important;
            display: block !important;
         ">

    <div style="margin-left: 8px;">
        <strong style="
            font-size: 16px;
            line-height: 18px;
            display: block;
        ">
            Baidehi Energy
        </strong>

        <small style="
            font-size: 10px;
            line-height: 12px;
            display: block;
        ">
            Clean Energy for Nepal
        </small>
    </div>

</a>

        <!-- =========================
             MOBILE MENU BUTTON
        ========================== -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- =========================
             NAVIGATION
        ========================== -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <!-- Home -->
                <li class="nav-item">
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                        href="{% url 'home' %}">
                        Home
                    </a>
                </li>


                <!-- About -->
                <li class="nav-item">
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                        href="{% url 'about' %}">
                        About Us
                    </a>
                </li>


                <!-- Project -->
                <li class="nav-item">
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'project' %}active{% endif %}"
                        href="{% url 'project' %}">
                        Our Project
                    </a>
                </li>


                <!-- Gallery -->
                <li class="nav-item">
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'gallery' %}active{% endif %}"
                        href="{% url 'gallery' %}">
                        Gallery
                    </a>
                </li>


                <!-- News -->
                <li class="nav-item">
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'news' %}active{% endif %}"
                        href="{% url 'news' %}">
                        News &amp; Notices
                    </a>
                </li>


                <!-- Contact -->
                <li class="nav-item ms-lg-3">

                    <a
                        class="btn btn-nav-contact {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                        href="{% url 'contact' %}">
                        Contact Us
                    </a>

                </li>

            </ul>

        </div>

    </div>
</nav>
