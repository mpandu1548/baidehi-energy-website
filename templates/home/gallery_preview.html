<section class="home-gallery-section">

    <div class="container">

        <div class="gallery-heading">

            <div>

                <span class="section-label">
                    PROJECT GALLERY
                </span>

                <h2>
                    A Look at Our Project
                </h2>

            </div>

            <a href="/gallery/" class="gallery-view-link">
                View Full Gallery
                <i class="bi bi-arrow-right"></i>
            </a>

        </div>


        <div class="gallery-preview-grid">

            {% for image in gallery_images %}

                <div class="gallery-preview-item {% if forloop.first %}large{% endif %}">

                    <img
                        src="{{ image.image.url }}"
                        alt="{{ image.title|default:'Baidehi Solar PV Project' }}"
                    >

                </div>

            {% empty %}

                <div class="gallery-preview-item large">

                    <div class="gallery-placeholder">

                        <i class="bi bi-image"></i>

                        <span>
                            Project Photos Coming Soon
                        </span>

                    </div>

                </div>

                <div class="gallery-preview-item">

                    <div class="gallery-placeholder">

                        <i class="bi bi-image"></i>

                        <span>
                            Project Photo
                        </span>

                    </div>

                </div>

                <div class="gallery-preview-item">

                    <div class="gallery-placeholder">

                        <i class="bi bi-image"></i>

                        <span>
                            Project Photo
                        </span>

                    </div>

                </div>

            {% endfor %}

        </div>

    </div>

</section>
