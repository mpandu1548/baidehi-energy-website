name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home1/baidehie/baidehie-energy
            previous_commit=$(git rev-parse HEAD)
            git pull origin main
            if ! git diff --quiet "$previous_commit" HEAD -- src; then
              cloudlinux-selector restart --json --interpreter nodejs --user baidehie --app-root baidehie-energy/
            fi
